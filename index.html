<!DOCTYPE html>
<html lang="ru">
<head>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#793B2B"><link rel="apple-touch-icon" href="img/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Тропинка">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тропинка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Great+Vibes&family=Bad+Script&family=Caveat:wght@500&family=Comforter&family=Lobster&family=Marck+Script&family=Manrope:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#F1E6DF;--card:#F8EFEA;--ink:#2A1424;--ink2:#5B4252;--line:#C9AFAF;--rust:#7A2E3D;--ochre:#B4874A;--az:#1F4A4C;--azg:transparent;--mist:#E8D8D1;--band:#3A1F33;--dark:#163A3C;--bandink:#F3E6DC;--gold:#D2AE73;
--c-choc:#5A1F2B;--c-olive:#5E8A73;--c-rust:#B57C7A;--c-ochre:#B4874A;--c-azure:#1F5E62;--c-plum:#4A2A44;
--fd:'Playfair Display',Didot,Georgia,serif;--fb:'EB Garamond',Garamond,Georgia,serif;--fh:'Manrope',system-ui,sans-serif;--fs:'Great Vibes','Segoe Script',cursive;--fsz:1.35}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#1B1118;--card:#251821;--ink:#F1E3DA;--ink2:#CDB3BE;--line:#4E3546;--rust:#E39AA6;--ochre:#D9AE6E;--az:#7FC1BF;--mist:#2D1E29;--band:#3A1F33;--dark:#123234;--c-choc:#C0606F;--c-plum:#A982A0;--c-azure:#5FA8A6}}
:root[data-theme="dark"]{--paper:#1B1118;--card:#251821;--ink:#F1E3DA;--ink2:#CDB3BE;--line:#4E3546;--rust:#E39AA6;--ochre:#D9AE6E;--az:#7FC1BF;--mist:#2D1E29;--band:#3A1F33;--dark:#123234;--c-choc:#C0606F;--c-plum:#A982A0;--c-azure:#5FA8A6}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--fb);font-size:18px;font-weight:500;line-height:1.55;-webkit-font-smoothing:antialiased}
main{max-width:460px;margin:0 auto;padding:18px 22px 120px}
h1,h2,h3{font-family:var(--fd);font-weight:400;margin:0;line-height:1.1}
h1{font-size:40px}h2{font-size:26px}h3{font-size:21px}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,label:focus-within{outline:1px solid var(--az);outline-offset:3px}
input{font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--ink2);padding:8px 2px;width:100%;border-radius:0}
input::placeholder{color:var(--ink2);opacity:.6;font-style:italic}
.muted{color:var(--ink2)}.small{font-size:15px}.it{font-style:italic}.center{text-align:center}
.script{font-family:var(--fs);color:var(--rust);font-size:calc(22px * var(--fsz));line-height:1.1}
.archwrap{position:relative;width:46%;max-width:190px;margin:6px auto 0}
.archframe{border:1px solid var(--ink2);border-radius:999px 999px 8px 8px;padding:7px}
.arch{display:block;width:100%;aspect-ratio:3/4;border-radius:999px 999px 4px 4px;overflow:hidden;background:var(--mist);border:1px solid var(--line)}
.arch img{width:100%;height:100%;object-fit:cover;display:block}
.arch svg{width:100%;height:100%;display:block;color:var(--ink2)}
.spark{position:absolute;color:var(--ochre);width:16px;height:16px}
.spark svg{width:100%;height:100%}
.dhead{margin:14px 0 4px}
.dhead .date{font-family:var(--fd);font-style:italic;color:var(--ink2);font-size:20px}
.sec{margin:34px 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec::after{content:"";flex:1;order:1;height:1px;background:var(--line);align-self:center;margin:0 4px}
.sec>*:last-child:not(:first-child){order:2}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--ink2);border-radius:999px;margin-top:10px}
.seg button{padding:6px 4px;border-radius:999px;color:var(--ink2);font-family:var(--fd);font-size:19px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.week{border:1px solid var(--line);border-radius:999px 999px 22px 22px;padding:16px 10px 10px;margin-top:22px}
.week .top{display:flex;justify-content:center;align-items:center;gap:8px;font-family:var(--fd);font-size:21px;color:var(--ink2);width:100%}
.week .top svg{width:14px;height:14px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:8px}
.wd{text-align:center;font-size:13px;color:var(--ink2);font-style:italic}
.cd{position:relative;aspect-ratio:1;display:grid;place-items:center}
.cd .num{font-family:var(--fd);font-size:19px;line-height:1;z-index:1}
.cd.fut .num{color:var(--ink2);opacity:.55}
.cd .dot{position:absolute;width:6px;height:6px;border-radius:50%;margin:-3px 0 0 -3px;left:50%;top:50%}
.cd .ring{position:absolute;inset:3px;border-radius:50%;border:1px solid var(--az)}
.cd.today .num{color:var(--az)}
.calnav{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.calnav button{width:40px;height:40px;display:grid;place-items:center;color:var(--ink2);font-size:22px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin:10px 6px 4px;font-size:14px;color:var(--ink2);justify-content:center}
.legend span::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--hc);margin-right:6px;vertical-align:1px}
.rt{border-bottom:1px solid var(--line)}
.rt-h{display:flex;align-items:center;gap:12px;padding:12px 0}
.rt-name{flex:1;text-align:left;min-width:0}
.rt-name .w{font-family:var(--fd);font-size:25px;line-height:1.1;display:block}
.rt-name .s{font-size:14px;color:var(--ink2);display:block;margin-top:2px;line-height:1.35}
.rt-name .n{font-size:14px;color:var(--rust);font-style:italic}
.starbtn{width:46px;height:46px;flex:none;display:grid;place-items:center;color:var(--hc)}
.starbtn svg{width:34px;height:34px}
.starbtn.part svg{opacity:.5}
.starbtn.skip{color:var(--rust)}
.starbtn.open svg{}
.pcard{border:1px solid var(--line);border-radius:999px 999px 20px 20px;padding:34px 18px 18px;margin:0 0 16px;background:var(--card);text-align:left}
.pcard .ct{text-align:center;margin-bottom:16px}
.addstar{display:flex;align-items:center;gap:14px;width:100%;padding:14px 0;color:var(--ochre);font-family:var(--fd);font-size:22px}
.addstar span.s{width:46px;height:46px;border:1px dashed var(--ochre);border-radius:50%;display:grid;place-items:center}
.addstar svg{width:22px;height:22px}
.stars{display:inline-flex;gap:2px;color:var(--ochre);vertical-align:-1px;margin-left:4px}
.stars svg{width:10px;height:10px}
.banner{text-align:center;padding:16px;border:1px solid var(--az);border-radius:999px 999px 20px 20px;margin-top:14px;padding-top:28px}
.banner h3{margin:0 0 4px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.scale button{border:1px solid var(--line);border-radius:999px 999px 10px 10px;padding:9px 2px 7px;font-size:14px;line-height:1.2;color:var(--ink2)}
.scale button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--mist)}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0 0}
.sw{width:44px;height:24px;border-radius:999px;border:1px solid var(--ink2);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;border:1px solid var(--ink2);transition:left .2s}
.sw[aria-pressed="true"]{border-color:var(--rust)}
.sw[aria-pressed="true"]::after{left:23px;background:var(--rust);border-color:var(--rust)}
.thesis{font-family:var(--fd);font-size:25px;line-height:1.25}
.tcard{border:1px solid var(--line);border-radius:999px 999px 20px 20px;padding:40px 22px 22px;text-align:center}
.src{font-size:14px;color:var(--ink2);margin-top:8px;font-style:italic}
.link{color:var(--az);text-decoration:underline;text-decoration-thickness:.5px;text-underline-offset:4px;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;align-items:center}
.chip{border:1px solid var(--line);border-radius:999px;padding:4px 13px;font-size:16px;color:var(--ink2);display:inline-flex;align-items:center;gap:6px}
.chip.rec{border-color:var(--ink2);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip .x{font-size:15px;line-height:1;color:var(--rust);padding-left:2px}
.more{display:inline-flex;align-items:center;gap:5px;color:var(--ochre);font-size:15px;padding:4px 10px;border:1px dashed var(--ochre);border-radius:999px}
.more svg{width:13px;height:13px}
.addrow{display:flex;gap:10px;margin-top:10px;align-items:flex-end}
.addrow button{color:var(--ochre);flex:none;padding:6px}
.addrow svg{width:18px;height:18px}
.btn{display:block;width:100%;padding:11px;border-radius:999px;border:1px solid var(--ink);font-family:var(--fd);font-size:21px;text-align:center}
.btn.main{background:var(--ink);color:var(--paper)}
.btn.ghost{border-color:var(--line);color:var(--ink2);font-size:18px}
.choice{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.choice button{border:1px solid var(--line);border-radius:999px 999px 12px 12px;padding:12px 4px 9px;font-size:16px}
.choice button[aria-pressed="true"]{border-color:var(--ink);background:var(--mist)}
.lbl{font-family:var(--fd);font-size:19px;color:var(--ink2);font-style:italic;margin:20px 0 0;display:block}
.timerow{display:flex;align-items:center;gap:12px;margin-top:6px}
.timerow input{width:120px;font-family:var(--fd);font-size:24px;text-align:center}
.timerow button{color:var(--az);font-size:15px}
.err{color:var(--rust);font-size:15px;margin-top:8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.stat .n{font-family:var(--fd);font-size:34px;line-height:1}
.stat .l{font-size:14px;color:var(--ink2);margin-top:4px;line-height:1.3}
.art{display:block;width:100%;text-align:left;padding:14px 0;border-bottom:1px solid var(--line)}
.art h3{font-size:24px}
.art p{font-size:16px;margin-top:4px;line-height:1.4;color:var(--ink2)}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.nav div{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.nav button{padding:9px 0 7px;font-size:15px;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:1px;font-family:var(--fd)}
.nav button[aria-current="page"]{color:var(--az)}
.nav button[aria-current="page"] svg{filter:drop-shadow(0 0 4px var(--azg))}
.nav svg{width:26px;height:26px}
.scrim{position:fixed;inset:0;background:rgba(42,20,36,.5);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:460px;max-height:92vh;max-height:92dvh;overflow:auto;border-radius:26px 26px 0 0;padding:20px 22px calc(26px + env(safe-area-inset-bottom,0px))}
.grab{width:40px;height:3px;border-radius:3px;background:var(--line);margin:-6px auto 16px}
.reader .intro{font-family:var(--fd);font-size:22px;font-style:italic;line-height:1.35;margin:14px 0 6px}
.reader .pt{margin:14px 0 0;padding-left:18px;position:relative}
.reader .pt::before{content:"";position:absolute;left:0;top:.65em;width:6px;height:6px;border:1px solid var(--ochre);transform:rotate(45deg)}
.todo{margin-top:22px;border:1.2px solid var(--gold);outline:.6px solid var(--gold);outline-offset:-6px;border-radius:22px;padding:22px 22px 18px;background:var(--card)}
.todo b{display:block;text-align:center;margin-bottom:8px}
.todo b{font-weight:400;font-family:var(--fd);font-size:20px;color:var(--rust);display:block;margin-bottom:4px;text-align:center}
.hint{font-size:15px;color:var(--ink2);border-left:1px solid var(--ochre);padding:4px 0 4px 12px;margin-top:14px;line-height:1.45}
.days{display:flex;gap:5px;margin-top:10px}
.days button{flex:1;border:1px solid var(--line);border-radius:10px;padding:6px 0;font-size:15px}
.days button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.cols{display:flex;gap:10px;margin-top:10px}
.cols button{width:32px;height:32px;border-radius:50%;background:var(--hc);border:2px solid var(--paper);outline:1px solid transparent}
.cols button[aria-pressed="true"]{outline-color:var(--ink);outline-offset:2px}
.rate{display:flex;gap:6px;margin-top:8px;color:var(--ochre)}
.rate svg{width:30px;height:30px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.mk{width:26px;height:26px;border-radius:50%;border:1px dashed var(--hc);display:grid;place-items:center;color:var(--paper);flex:none}
.mk.done{background:var(--hc);border-style:solid}.mk.part{background:linear-gradient(90deg,var(--hc) 50%,transparent 50%);border-style:solid}.mk.skip{border-style:solid;color:var(--hc)}
.mk svg{width:14px;height:14px}
.q{margin-top:16px}
.q input[type=range]{padding:0;border:0;accent-color:var(--rust)}
.prog{border-top:1px solid var(--line);padding:16px 0 4px}
.prog .t{display:flex;gap:10px;align-items:baseline}
.prog .t::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--hc);flex:none}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.gal .g{position:relative}
.gal .arch{aspect-ratio:3/4}
.gal .del{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;background:var(--paper);border:1px solid var(--line);color:var(--rust)}
.upl{display:block;text-align:center;margin-top:18px;cursor:pointer}
.upl input{position:absolute;opacity:0;width:1px;height:1px}
.moons{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;margin-top:6px}
.moons button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 0 6px;font-size:13px;line-height:1.2;color:var(--ink2);border-radius:999px 999px 14px 14px;border:1px solid transparent}
.moons svg{width:34px;height:34px}
.moons button[aria-pressed="true"]{color:var(--ink);border-color:var(--line);background:var(--card)}
.moons button[aria-pressed="true"] svg{color:var(--az);filter:drop-shadow(0 0 5px var(--azg))}
.band{background:var(--band);color:var(--bandink);margin:34px -22px 0;padding:46px 30px 40px;text-align:center;position:relative}
.band .eyebrow{font-family:var(--fd);font-size:30px;margin-bottom:22px;color:var(--bandink)}
.band .src{color:#B9B2A6}.band .link{color:#9CC7E3}
.band .archwrap{width:36%;max-width:150px;margin:0 auto 22px}.band .archframe{border-color:#6E6A64}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.moonstat{text-align:center;border:1px solid var(--line);border-radius:999px 999px 18px 18px;padding:26px 8px 16px}
.moonstat svg{width:54px;height:54px;color:var(--az)}
.moonstat .n{font-family:var(--fd);font-size:40px;line-height:1;margin-top:8px}
.moonstat .l{font-size:14px;color:var(--ink2);margin-top:4px;font-style:italic}
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.acard{border:1px solid var(--line);border-radius:999px 999px 18px 18px;padding:24px 8px 16px;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--card)}
.acard .ring{position:relative;width:88px;height:88px;display:grid;place-items:center}
.acard .ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.acard .ring .n{font-family:var(--fd);font-size:26px;line-height:1}
.acard .t{font-family:var(--fd);font-size:21px;line-height:1.1;text-align:center}
.acard.add{border-style:dashed;border-color:var(--ochre);color:var(--ochre);background:transparent;justify-content:center}
.acard.add svg{width:34px;height:34px}
.acard.paused{opacity:.5}
.kv{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.kv span:first-child{color:var(--ink2);font-style:italic}
.kv span:last-child{text-align:right}
.feat{display:block;width:100%;text-align:center;margin-top:6px}
.feat .archwrap{width:52%;max-width:220px}
.feat h2{font-size:32px;margin-top:16px}
.lgrid{display:grid;grid-template-columns:1fr 1fr;gap:22px 14px;margin-top:14px}
.lcard{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.lcard .arch{aspect-ratio:4/5;display:grid;place-items:center;background:var(--mist)}
.lcard .archframe{width:100%;padding:5px}
.lcard .arch svg{width:44%;height:auto;color:var(--ink2)}
.lcard h3{font-size:20px}
.stg{font-family:var(--fs);color:var(--rust);font-size:calc(16px * var(--fsz));line-height:1.1}
.hero{background:var(--dark);color:var(--bandink);margin:-18px -22px 0;padding:22px 22px 26px;text-align:center}
.hero .archframe{border-color:var(--gold)}.hero .arch{border-color:#3A4352}
.hero .spark{color:var(--gold)}
.hero h1{color:var(--bandink)}.hero .script{color:var(--gold)}.hero .date{color:#C9BFB0}
.hero .fontbtn{display:inline-block}
.banner{background:var(--band);color:var(--bandink);border:0!important}
.banner .muted{color:#D9C9C0}
.band{background:var(--band)!important}
.nav{background:#24121F!important;border-top:0!important}
.nav button{color:#B9AE9F!important}.nav button[aria-current="page"]{color:var(--gold)!important}
.moonstat{background:var(--dark);border:0!important;color:var(--bandink)}.moonstat svg{color:var(--gold)!important}.moonstat .l{color:#C9BFB0!important}
.lcard .arch{background:var(--dark)!important;border-color:var(--dark)!important}.lcard .arch svg{color:var(--gold)!important}
.moons button[aria-pressed="true"] svg{color:#CFA43E}.moons button[aria-pressed="true"]{border-color:#CFA43E}
.stars,.rate,.more,.addrow button{color:var(--ochre)}
.fontopt{display:block;width:100%;text-align:left;padding:12px 16px;border:1px solid var(--line);border-radius:999px 999px 16px 16px;margin-top:10px}
.fontopt[aria-pressed="true"]{background:var(--dark);color:var(--bandink);border-color:var(--dark)}
.fontopt .sample{font-size:34px;line-height:1.2;display:block;color:inherit}
.fontopt .nm{font-size:13px;color:var(--ink2)}
.fontopt[aria-pressed="true"] .nm{color:#C9BFB0}
.tarot{position:relative;aspect-ratio:3/4.7;border-radius:12px;color:#F0DFD0;overflow:hidden;display:block;width:100%;text-align:center}
.tarot::before{content:"";position:absolute;inset:6px;border:1px solid rgba(240,223,208,.6);border-radius:8px}
.tarot::after{content:"";position:absolute;inset:10px;border:1px solid rgba(240,223,208,.28);border-radius:6px}
.tarot .tm{position:absolute;top:16px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:12px;color:#F2D9C9}
.tarot .tm svg{width:30px;height:30px}.tarot .tm .st{width:11px;height:11px}
.tarot .pl{position:absolute;top:24%;left:12%;right:12%;bottom:24%}
.tarot .pl svg{width:100%;height:100%}
.tarot .tt{position:absolute;bottom:16px;left:14px;right:14px;font-family:var(--fd);font-size:13px;letter-spacing:.12em;text-transform:uppercase;line-height:1.3}
.tarot .tt::before{content:"";display:block;width:60%;height:1px;background:rgba(240,223,208,.45);margin:0 auto 8px}
.tarot .cn{position:absolute;width:12px;height:12px;border:1px solid rgba(240,223,208,.55);border-radius:50%}
.lgrid{grid-template-columns:1fr 1fr!important;gap:14px!important}
.featwrap{text-align:center;margin-top:6px}
.featwrap h2{font-size:30px;margin:14px 0 4px}

<script>
const DAY=864e5,T=new Date();T.setHours(12,0,0,0);
const k=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const D=s=>new Date(s+'T12:00:00');
const TODAY=k(T);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const WD=['вс','пн','вт','ср','чт','пт','сб'];
const MON=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const COLORS=['choc','olive','rust','ochre','azure','plum'];
const plural=(n,a,b,c)=>n%10===1&&n%100!==11?a:n%10>=2&&n%10<=4&&(n%100<10||n%100>=20)?b:c;
const nowHM=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const STAR=(f)=>`<svg viewBox="0 0 24 24" fill="${f?'currentColor':'none'}" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"><path d="M12 2.5c.6 5 1.6 8 9.5 9.5-7.9 1.5-8.9 4.5-9.5 9.5-.6-5-1.6-8-9.5-9.5 7.9-1.5 8.9-4.5 9.5-9.5z"/></svg>`;
const STARX='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"><path d="M12 2.5c.6 5 1.6 8 9.5 9.5-7.9 1.5-8.9 4.5-9.5 9.5-.6-5-1.6-8-9.5-9.5 7.9-1.5 8.9-4.5 9.5-9.5z"/><path d="M10 10l4 4M14 10l-4 4" stroke-linecap="round"/></svg>';
const stars=n=>`<span class="stars" aria-label="Важность ${n} из 5">${[1,2,3,4,5].map(i=>i<=n?STAR(1):'').join('')}</span>`;
const CHECK='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M3.5 8.5l3 3 6-7"/></svg>';
const CROSS='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>';
const CHEV=up=>`<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"><path d="${up?'M4 10l4-4 4 4':'M4 6l4 4 4-4'}"/></svg>`;
const SCENE='<svg viewBox="0 0 300 400" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="150" cy="110" r="34"/><circle cx="150" cy="110" r="44" stroke-dasharray="1 6"/><path d="M60 70l0 8M56 74h8M236 60v10M231 65h10M90 150v6M87 153h6M218 140v6M215 143h6"/><path d="M0 300c40-30 90-40 150-22s110 10 150-16"/><path d="M0 330c50-20 110-18 160-4s100 8 140-8"/><path d="M40 300V200M40 200l-22 40h44zM40 222l-26 46h52zM40 246l-30 54h60z"/><path d="M258 296V196M258 196l-20 36h40zM258 216l-24 44h48zM258 240l-28 52h56z"/><path d="M200 318V250M200 250l-14 26h28zM200 266l-18 34h36z"/><path d="M110 330c8-8 16-8 24 0M170 340c6-6 12-6 18 0"/><path d="M118 360c10 4 20 4 30 0s20-4 30 0" stroke-dasharray="2 4"/><path d="M128 200c4-4 8-4 12 0M140 200c4-4 8-4 12 0M180 185c3-3 6-3 9 0M189 185c3-3 6-3 9 0"/></svg>';
const SPARK='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1c.5 6 2 9.5 11 11-9 1.5-10.5 5-11 11-.5-6-2-9.5-11-11 9-1.5 10.5-5 11-11z"/></svg>';
const NAVI={
today:'<svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M10 24h8M11.5 24V13h5v11"/><path d="M14 13v-2"/><path d="M14 10c-1.4-1.2-1.2-3 0-5 1.2 2 1.4 3.8 0 5z"/><path d="M8 24c-1-1-1-2 0-3M20 24c1-1 1-2 0-3"/></svg>',
stats:'<svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M18 5a9 9 0 1 0 0 18 7 7 0 1 1 0-18z"/><path d="M22 8v3M20.5 9.5h3M23 17v2M22 18h2"/></svg>',
lib:'<svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M3 7c3.5-1.4 7-1.4 11 .8v15C10 20.6 6.5 20.6 3 22z"/><path d="M25 7c-3.5-1.4-7-1.4-11 .8v15c4-2.2 7.5-2.2 11-.8z"/></svg>'};

const ARTS=[
{id:'a1',st:'start',t:'Почему не 21 день',l:'Сколько на самом деле складывается привычка',
i:'В этом материале — откуда взялись знаменитые «21 день», что показывают настоящие исследования и как понять, что привычка уже твоя.',
p:['«21 день» — не результат исследования. Цифра из книги хирурга Максвелла Мальца 1960 года. Он заметил, что пациентам нужно около трёх недель, чтобы привыкнуть к новому лицу в зеркале. К привычкам это отношения не имеет.',
'Настоящие цифры получила психолог Филиппа Лалли в 2010 году. 96 человек двенадцать недель вводили по одной привычке и каждый день отмечали, насколько действие стало автоматическим. В среднем до момента «легче уже не становится» прошло 66 дней. У кого-то 18, у кого-то 254.',
'В 2024 году вышел обзор двадцати исследований (Сингх и коллеги). Вывод похожий: обычно от двух до пяти месяцев.',
'Скорость зависит от сложности. Стакан воды утром закрепляется быстро, пробежка — медленно.'],
d:'Не считай дни подряд. Раз в две недели проверяй, стало ли легче: в календаре для этого есть проверка автоматизма.',
s:['Lally P. et al. European Journal of Social Psychology, 2010; n = 96','Singh B. et al. Healthcare, 2024; 20 исследований']},
{id:'a2',st:'start',t:'Якорь важнее мотивации',l:'Почему «после кофе» работает, а «вечером» нет',
i:'Здесь о том, почему расплывчатые планы почти не работают, и как выбрать событие, за которое привычка зацепится сама.',
p:['Привычка — это связка «ситуация → действие». Сначала ты вспоминаешь о деле сама. Потом ситуация начинает напоминать за тебя.',
'Психологи называют это намерением реализации: план «когда случится X, я сделаю Y». Петер Голльвитцер и Пасхаль Ширан в 2006 году свели вместе 94 исследования — больше 8000 участников. Такие планы заметно повышали шанс выполнить задуманное.',
'Хороший якорь — то, что и так происходит каждый день: выпила кофе, почистила зубы, закрыла ноутбук.',
'«Вечером» и «когда будет время» — не якоря, а промежутки. Мозгу не за что зацепиться.'],
d:'Если среди причин пропуска часто «забыла», поменяй якорь. Дисциплина тут ни при чём.',
s:['Gollwitzer P., Sheeran P. Advances in Experimental Social Psychology, 2006; 94 исследования','Wood W., Neal D. Psychological Review, 2007']},
{id:'a3',st:'start',t:'Начни со смешно малого',l:'Минимальная версия как страховка на плохой день',
i:'О том, зачем каждой привычке маленькая версия и почему в тяжёлый день мозг тянет к старому.',
p:['В первые недели важно не сколько ты сделала, а что сделала в той же ситуации. Связку укрепляет повтор, а не объём.',
'Стресс переключает мозг на автопилот. В эксперименте Ларса Швабе и Оливера Вольфа (2009) после стресса люди чаще действовали по привычке — даже когда это уже не приносило награды.',
'Значит, в плохой день новая привычка проигрывает старым. Шанс остаётся только у очень маленькой версии.',
'Би Джей Фогг называет такой подход Tiny Habits. Это методика, а не строгое исследование, но она совпадает с тем, что известно о повторении.'],
d:'Придумай минимум, который получится даже в самый тяжёлый день. В режиме «Минимум» он засчитывается полностью.',
s:['Schwabe L., Wolf O. Journal of Neuroscience, 2009','Fogg B. J. Tiny Habits, 2019 (методика)']},
{id:'a4',st:'growth',t:'Удовольствие — это механизм',l:'Что на самом деле делает дофамин',
i:'Почему приятное закрепляется быстрее полезного и как использовать это, а не бороться с этим.',
p:['Дофамин — не «гормон удовольствия». Он сообщает мозгу: «вышло лучше, чем я ждал». Вольфрам Шульц показал это в 1997 году: нейроны сначала реагируют на неожиданную награду, а потом на сигнал, который её предвещает.',
'Кейтлин Вулли и Айелет Фишбах (2017) выяснили: дольше держатся за цель те, кому приятно сейчас. А не те, кто помнит о пользе в будущем.',
'Кэти Милкман в 2014 году разрешила 226 участникам слушать любимые аудиокниги только в спортзале. Посещаемость выросла.'],
d:'Смотри на отметку «как было». Если «через силу» чаще раза из трёх — поменяй форму: место, музыку, время, компанию. Спроси себя, что сделает это на десять процентов приятнее.',
s:['Schultz W. et al. Science, 1997','Woolley K., Fishbach A. Personality and Social Psychology Bulletin, 2017','Milkman K. et al. Management Science, 2014; n = 226']},
{id:'a5',st:'growth',t:'Твоё «зачем»',l:'Почему «хочу» держит дольше, чем «надо»',
i:'О разнице между своим и навязанным мотивом — и о том, почему причины в приложении пишешь ты сама.',
p:['Психологи Ричард Райан и Эдвард Деси описали три опоры устойчивой мотивации: выбрала сама, получается, есть связь с людьми. Это теория самодетерминации.',
'В 2012 году Нг и коллеги проверили её на 184 исследованиях о здоровье. Когда мотив свой, люди лучше заботятся о себе и лучше себя чувствуют.',
'«Надо, а то осудят» тоже работает. Но только пока есть давление.'],
d:'Записывай «зачем» своими словами. Если причина больше не откликается, пересобери привычку, а не дожимай её.',
s:['Ryan R., Deci E. American Psychologist, 2000','Ng J. et al. Perspectives on Psychological Science, 2012; 184 исследования']},
{id:'a6',st:'any',t:'Время не резиновое',l:'Каждая привычка что-то вытесняет',
i:'Здесь о том, что почти все трекеры забывают про твои часы и силы, и как увидеть, чем ты платишь за новое.',
p:['Почти все трекеры молча считают, что у тебя есть свободный час. Его нет. Новое всегда занимает место старого.',
'Мы плохо оцениваем время. Роджер Бюлер в 1994 году показал: люди недооценивают сроки, даже когда помнят, что раньше ошибались. Это называют ошибкой планирования.',
'Отметка «вместо чего» делает обмен видимым. «Читала вместо сериала» — честная сделка. «Тренировалась вместо сна» — повод задуматься.'],
d:'Если привычка регулярно съедает сон, еду или отдых, это не дисциплина, а перерасход. Уменьши её или перенеси.',
s:['Buehler R. et al. Journal of Personality and Social Psychology, 1994']},
{id:'a7',st:'any',t:'Сила воли — не батарейка',l:'Что происходит, когда к вечеру «нет сил»',
i:'В этом материале — почему идея «сила воли заканчивается» не подтвердилась и что объясняет вечернюю усталость лучше.',
p:['Долго считалось, что сила воли тратится как заряд. Это называли эго-истощением.',
'В 2016 году Мартин Хаггер с коллегами повторили классический опыт в 23 лабораториях на 2141 человеке. Эффект почти исчез.',
'Майкл Инцлихт и Брэндон Шмайхель (2012) объясняют иначе: к вечеру меняется не запас, а приоритеты. Тянет к отдыху и быстрой награде.',
'Настоящая усталость при этом существует: недосып, нагрузка, болезнь.'],
d:'Сравни энергию и выполнение в календаре. Если вечерние привычки срываются чаще, перенеси их на утро.',
s:['Hagger M. et al. Perspectives on Psychological Science, 2016; n = 2141','Inzlicht M., Schmeichel B. Perspectives on Psychological Science, 2012']},
{id:'a8',st:'middle',t:'Пропуск — часть тропинки',l:'Как один день перестаёт обнулять месяц',
i:'О том, почему один пропуск не страшен, а страшна реакция на него — и что помогает вернуться.',
p:['В исследовании Лалли пропуск одного дня не мешал привычке формироваться.',
'Мешает другое — эффект «да гори оно всё». Психологи Алан Марлатт и Джудит Гордон описали его в 1985 году: после одного срыва человек бросает всё, раз уже «испортил».',
'Джулиана Брейнс и Серена Чен (2012) в четырёх экспериментах проверили, что помогает после неудачи. Сочувствие к себе работало лучше похвалы: люди больше старались исправиться.'],
d:'Держи правило «не пропускать дважды подряд». А причины пропусков читай как данные: «забыла» — про якорь, «вне распорядка» — про поездки, «устала» — про время дня.',
s:['Lally P. et al., 2010','Marlatt G., Gordon J. Relapse Prevention, 1985','Breines J., Chen S. Personality and Social Psychology Bulletin, 2012']},
{id:'a9',st:'any',t:'Не отличница',l:'Почему «наметила и сделала» важнее идеальной серии',
i:'Здесь о перфекционизме, выгорании и о том, почему маленькое ощущение продвижения двигает сильнее больших целей.',
p:['Перфекционизм — это стремление к безупречности плюс жёсткая критика к себе. Томас Курран и Эндрю Хилл (2019) проанализировали 164 выборки: у молодых людей он растёт десятилетиями.',
'Тревога «а вдруг недостаточно хорошо» связана с выгоранием. Это тоже показали Хилл и Курран.',
'Тереза Амабайл разобрала около 12 000 дневниковых записей 238 человек. Сильнее всего мотивацию поднимал день, в который чувствовалось продвижение.',
'Бенджамин Харкин (2016) по 138 исследованиям: отслеживание прогресса помогает достигать целей, особенно если результат записывать.'],
d:'Планируй реалистично. Выполненный план дня — отдельная победа, и приложение её отмечает.',
s:['Curran T., Hill A. Psychological Bulletin, 2019','Amabile T., Kramer S. The Progress Principle, 2011','Harkin B. et al. Psychological Bulletin, 2016; 138 исследований']},
{id:'a10',st:'any',t:'Что отмечать о себе',l:'Настроение, энергия и перегруз',
i:'Зачем три отдельные отметки вместо одной и что они покажут через месяц.',
p:['Настроение и энергия — разные шкалы. Джеймс Рассел описал это в 1980 году: «приятно — неприятно» и «бодро — вяло» не зависят друг от друга. Можно быть спокойной и уставшей.',
'Перегруз объясняет пропуски лучше, чем «лень».',
'В терапии депрессии есть метод поведенческой активации: сначала действие, потом настроение. Пим Кёйперс с коллегами (2007) по шестнадцати исследованиям подтвердили, что он работает.'],
d:'Отмечай коротко, без оценок. Через месяц в календаре будет видно, при какой энергии у тебя всё получается.',
s:['Russell J. Journal of Personality and Social Psychology, 1980','Cuijpers P. et al. Clinical Psychology Review, 2007; 16 исследований']},
{id:'a11',st:'middle',t:'Мозг: тропинка в лесу',l:'Как «надо вспомнить» становится «само собой»',
i:'Что происходит в голове, пока действие переходит из сознательного в автоматическое — и почему старое никуда не девается.',
p:['Новая привычка похожа на тропинку в высокой траве. Каждый проход её утаптывает.',
'Сначала действием руководит участок мозга, который отвечает за цели, — дорсомедиальный стриатум. С повторением управление переходит к соседнему, дорсолатеральному. Это и есть автопилот. Об этом обзор Генри Иня и Барбары Ноултон (2006).',
'Энн Грейбил (2008) показала: мозг склеивает цепочку шагов в один блок. Поэтому привычка запускается целиком, как одно движение.',
'Старая тропинка не исчезает, а зарастает. В стрессе ноги сами идут по ней.'],
d:'Не считай возврат к старому провалом — это биология. Просто вернись на новую тропинку завтра.',
s:['Yin H., Knowlton B. Nature Reviews Neuroscience, 2006','Graybiel A. Annual Review of Neuroscience, 2008']},
{id:'a12',st:'any',t:'Когда привычки буксуют',l:'Взгляд психиатрии',
i:'Иногда дело не в характере. Здесь о том, как депрессия, тревога и СДВГ меняют работу привычек.',
p:['При депрессии хуже работает система вознаграждения: то, что радовало, перестаёт радовать. Это называется ангедонией (обзор Диего Пиццагалли, 2014). Если привычка не приносит удовольствия, это может быть симптомом.',
'При СДВГ трудно ждать награды. Эдмунд Сонуга-Барк описал это как отвращение к задержке. Помогают мгновенная награда и внешняя структура.',
'Тревога сужает внимание. Новое действие требует больше сил, поэтому минимальные версии особенно важны.'],
d:'Если две недели и дольше энергия на нуле и ничего не радует, сходи к врачу. Строже себя дисциплинировать не нужно.',
s:['Pizzagalli D. Annual Review of Clinical Psychology, 2014','Sonuga-Barke E. Biological Psychiatry, 2005']},
{id:'a13',st:'auto',t:'Новая обстановка — новое окно',l:'Переезды, отпуска и понедельники',
i:'О моментах, когда менять привычки легче всего, и о том, как не потерять их в отпуске.',
p:['Бас Верпланкен и Дебора Рой (2016) изучили около 800 человек. Недавно переехавшие легче меняли привычки: старые триггеры исчезали вместе со старым домом.',
'Хенчен Дай, Кэти Милкман и Джейсон Риис (2014) назвали это эффектом нового старта. В понедельник, первое число месяца, после дня рождения люди чаще берутся за цели.',
'Работает и наоборот: отпуск ломает новые привычки.'],
d:'После поездки начинай с минимума. Раз в три месяца спрашивай себя, служит ли привычка своему «зачем». Если нет — отпусти её.',
s:['Verplanken B., Roy D. Journal of Environmental Psychology, 2016','Dai H. et al. Management Science, 2014']}];

function week(f){const p=F[f],dow=(T.getDay()+6)%7;let c='';for(let i=0;i<7;i++){const off=dow-i,fut=off<0,dt=addD(T,-off);const vals=fut?[]:off===0?p.today:p.habits.map(h=>h.days[h.days.length-off]||0);

function starPath(h){const n=h.days.length,show=Math.min(n,36),d=h.days.slice(-show),off=n-show;const W=300,H=130;

['Сегодня — главный экран',['<b>Шапка.</b> Картина дня в арке. Тап по картине — галерея: можно выбрать свою или оставить смену каждый день.','<b>Палитра</b> слева сверху — оформление: пять цветовых схем, рукописный шрифт, выход из аккаунта.','<b>Звезда связи</b> справа сверху — сохранено ли всё в таблице. Залитая — да; с цифрой — столько изменений ждут интернета.','<b>Луна с знаком</b> под датой — лунный день: что за день, советы по телу и волосам, «Небо сейчас» и астрокалендарь.','<b>Неделя.</b> Точки вокруг даты — рутины дня, залитый круг — весь план выполнен, золотой месяц — сегодня. Тап по неделе раскрывает месяц, тап по дню — что было в тот день.','<b>Ресурс дня</b>: полный, бережный или минимум. В тяжёлый день засчитывается и минимум — «не пропускай дважды» важнее идеального дня.','<b>Рутины.</b> Тап по звезде справа — отметить: сделала, частично или пропуск, во сколько, и при желании настроение до и после. Тап по названию — настройки рутины.','<b>Новая рутина</b> — пунктирная звезда внизу списка: якорь («после чего»), как часто, важность, иконка, растение для сада, цвет.','<b>Как ты</b> — сон, настроение и энергия лунами: чем полнее луна, тем лучше. Перегруз — отметка тяжёлого дня с причиной.','<b>Мысль дня</b> — тезис из исследования. «Читать подробнее» открывает статью.']],
['Подруги',['<b>Звёзды у шапки.</b> Пустая звезда — добавить подругу. Звезда с лучами — ты открыла ей доступ. Окошко с картиной — она открыла доступ тебе.','<b>Настроить доступ</b> — тап по звезде подруги: отдельный выключатель для каждой рутины, для сна и настроения, прочитанного, перегруза и для каждой цифры итогов.','<b>В гости</b> — тап по окошку подруги: её неделя, рутины со «Звёздным путём», настроение волнами, итоги и что она читала. Всё — только просмотр и только открытое.','<b>Звезда за день</b> — кнопка внизу у подруги. Звезда загорится у её картины в цвете твоей схемы и погаснет за три дня.','<b>Вернуться к себе</b> — тап по своему окошку «я» или по любой вкладке внизу.']],
['Итоги',['<b>Сад привычек.</b> Каждая рутина — растение. Росток — первые 20 дней, листья — с 21-го, цветы — с 66-го дня или когда проверка показала автоматизм. Тап — подробности рутины.','<b>Лунный месяц</b> — пять недель настроения: каждый день луна, золотое кольцо — весь план выполнен.','<b>Часы рутин</b> — во сколько ты обычно делаешь каждую рутину: полночь наверху, полдень внизу.','<b>Цифры в арках</b> — как дела идут в бодрые и тяжёлые дни, после хорошей и плохой ночи. Тап по цифре — откуда она взялась.','<b>До и после, с рутиной и без</b> — как рутина влияет на настроение.']],
['Чтение',['<b>Сейчас для тебя</b> — статья под этап твоей самой молодой рутины.','<b>Карты.</b> Луна наверху — этап: тонкий серп — первая неделя, полная — после 90 дней. Звезда вместо луны — статья на любой момент.','<b>Оценка</b> — от одной до трёх звёзд внутри статьи. Подруги увидят её, если ты открыла им «Что читала».']],
['Без интернета',['Всё, что ты отмечаешь, сразу сохраняется на телефоне — приложение работает и без связи.','Когда связь появится, изменения сами уйдут в таблицу. Звезда связи снова станет залитой.','Чтобы «Тропинка» открывалась как приложение: в Safari — «Поделиться» → «На экран „Домой“».']],
['Аккаунт и данные',['«Тропинка» — личное приложение Марии. Данные хранятся в Google-таблице на её аккаунте, у каждой — свой лист.','Пароли хранятся только в зашифрованном виде. Забыла пароль — напиши Марии, она выдаст временный.','Выйти или удалить аккаунт со всеми данными — в «Оформлении» (палитра слева сверху).']]];
function helpBtn(){return `<button class="helpq" data-help aria-label="Как пользоваться приложением"><svg viewBox="0 0 44 58" aria-hidden="true"><path d="M2 56V22A20 20 0 0 1 42 22V56Z" fill="none" stroke="var(--gold)" stroke-width="1.4"/><path d="M6.5 52V22A15.5 15.5 0 0 1 37.5 22V52" fill="none" stroke="var(--gold)" stroke-width=".6"/><text x="22" y="44" text-anchor="middle" font-family="Playfair Display,Georgia,serif" font-size="25" fill="var(--gold)">?</text></svg><span>Как пользоваться</span></button>`}
function openHelp(){L={type:'help'};sheet(`<span class="script center" style="display:block">путеводитель</span><h2 class="center">Как пользоваться</h2>${HELP.map(([t,items],i)=>`<details class="hlp" ${i===0?'open':''}><summary>${t}</summary><ul>${items.map(x=>`<li>${x}</li>`).join('')}</ul></details>`).join('')}`)}

document.getElementById('nav').innerHTML=[['today','Сегодня'],['stats','Итоги'],['lib','Чтение']].map(([id,l])=>`<button data-tab="${id}" ${S.tab===id?'aria-current="page"':''}>${NAVI[id]}${l}</button>`).join('');save();trackChange();updSync()}

const CRESC=t=>`<svg class="cres t" viewBox="0 0 48 48" aria-hidden="true"><path d="M26.9 3.2A21 21 0 1 0 44.9 25.8A18.2 18.2 0 1 1 26.9 3.2z" fill="currentColor"/></svg>`;
function dayCell(dt,act){const dk=k(dt),lg=S.logs[dk]||{},fut=dk>TODAY;
const hs=act.filter(h=>lg[h.id]||(!fut&&sched(h,dt)&&h.freq.type!=='weekly')).sort(byStars);
const req=hs.filter(h=>h.freq.type!=='weekly');const full=req.length&&req.every(h=>lg[h.id]&&lg[h.id].s!=='skip');
const R=18;const dots=hs.map((h,i)=>{const a=-Math.PI/2+i*2*Math.PI/hs.length;const l=lg[h.id];
const sty=!l?`border:1px solid var(--c-${h.color});opacity:.45;`:l.s==='done'?`background:var(--c-${h.color});`:l.s==='part'?`background:var(--c-${h.color});opacity:.5;`:`border:1px solid var(--c-${h.color});`;
return `<span class="dot" style="transform:translate(${(Math.cos(a)*R).toFixed(1)}px,${(Math.sin(a)*R).toFixed(1)}px);${sty}"></span>`}).join('');
const ev=!!(ASTRO.find(x=>x.s===dk)||S.fstars.some(z=>z.to==='me'&&z.day===dk));
return `<button class="cd ${fut?'fut':''} ${dk===TODAY?'today':''} ${full?'done':''}" data-day="${dk}" aria-label="${dt.getDate()} ${MON[dt.getMonth()]}${full?', план выполнен':''}">${dk===TODAY?CRESC(1):''}${FR.calStars(dk)}${astroMark(dk)}<span class="num">${dt.getDate()}</span>${dots}</button>`}

function vCalendar(){const act=S.habits.slice();const wl=['пн','вт','ср','чт','пт','сб','вс'].map(w=>`<span class="wd">${w}</span>`).join('');
if(!S.calOpen){const dow=(T.getDay()+6)%7;let c='';for(let i=0;i<7;i++)c+=dayCell(addD(T,i-dow),act);
return `<div class="week"><button class="top" data-calopen aria-expanded="false">${MON[T.getMonth()]} ${CHEV(0)}</button><div class="cal">${wl}${c}</div></div>`}
const {y,m}=S.cal,first=new Date(y,m,1,12),off=(first.getDay()+6)%7,n=new Date(y,m+1,0).getDate();let c='';
for(let i=0;i<off;i++)c+='<span></span>';for(let d=1;d<=n;d++)c+=dayCell(new Date(y,m,d,12),act);
return `<div class="week"><button class="top" data-calopen aria-expanded="true">свернуть ${CHEV(1)}</button>
<div class="calnav"><button data-calm="-1" aria-label="Предыдущий месяц">‹</button><h3>${MON[m]} ${y}</h3><button data-calm="1" aria-label="Следующий месяц">›</button></div>
<div class="cal">${wl}${c}</div>
<div class="legend">${act.map(h=>`<span style="--hc:var(--c-${h.color})">${esc(h.name)}</span>`).join('')}</div>
<p class="small muted it center" style="margin:6px 8px 4px">Полная точка — сделала, бледная — частично, пустая — не отмечено. Лазурный круг — план дня выполнен.</p></div>`}

let OPEN=null;
function vToday(){const di=dayInfo(TODAY),lg=dayLog(TODAY);
const hs=S.habits.filter(h=>sched(h,T)).sort(byStars),req=hs.filter(h=>h.freq.type!=='weekly');
const done=req.filter(h=>lg[h.id]&&lg[h.id].s!=='skip').length;
const th=THESES[Math.floor(T/DAY)%THESES.length];
return `<section class="hero"><button class="syncbtn" data-sync aria-label="Связь с таблицей"></button><button class="designbtn" data-fonts aria-label="Оформление: цветовая схема и шрифт"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M12 3a9 9 0 1 0 0 18c1.4 0 2-1 2-2 0-1.4-1.2-1.6-1.2-2.8 0-1 .8-1.7 1.8-1.7H17a4 4 0 0 0 4-4C21 6.4 17 3 12 3z"/><circle cx="7.5" cy="11" r="1.2" fill="currentColor"/><circle cx="10" cy="7.3" r="1.2" fill="currentColor"/><circle cx="14.5" cy="7.3" r="1.2" fill="currentColor"/><circle cx="17" cy="11" r="1.2" fill="currentColor"/></svg></button>${FR.fieldSVG(110,150,3,"left:6px;top:14px")}${FR.fieldSVG(110,150,7,"right:6px;top:40px")}${(()=>{const g=allArt(),i=S.heroArt!=null?S.heroArt:Math.floor(T/DAY);return FR.heroRow("me",g[((i%g.length)+g.length)%g.length])})()}
<div class="dhead"><button class="fontbtn" data-fonts aria-label="Выбрать рукописный шрифт"><span class="script">Тропинка</span></button><h1>Сегодня</h1><div class="date">${T.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})}</div><button class="moonbtn" data-moon aria-label="Луна сегодня">${(()=>{const m=moonData();return moonIcon(m)+`<span class="zg">${ZG[m.sign]}</span>Луна в ${ZN[m.sign]}`})()}</button></div></section>
${vCalendar()}
<div class="sec"><h2>Ресурс дня</h2></div>
<div class="seg" role="group" aria-label="Режим дня">${[['full','Полный'],['soft','Бережный'],['min','Минимум']].map(([m,l])=>`<button data-mode="${m}" aria-pressed="${di.mode===m}">${l}</button>`).join('')}</div>
<p class="small muted it center" style="margin-top:6px">${di.mode==='full'?'обычный объём':di.mode==='soft'?'можно меньше':'засчитываю минимальную версию'}</p>
<div class="sec"><h2>Что сделать</h2><span class="small muted">${done} из ${req.length}</span></div>
${hs.length?hs.map(h=>row(h,lg[h.id],di.mode)).join(''):`<div class="emptyday">${plantImg('a7','light','evig')}<p class="small muted">На сегодня рутин нет. Добавь первую — она вырастет в твоём саду в «Итогах».</p></div>`}
<button class="addstar" data-newhabit><span class="s">${STAR(0)}</span>Новая рутина</button>
${req.length&&done===req.length?`<div class="banner"><h3>План дня выполнен</h3><p class="small muted">Наметила реалистично и сделала. Это и есть результат.</p></div>`:''}
<div class="sec"><h2>Как ты</h2></div>
<span class="small muted it">Как спала</span>
<div class="moons" role="group" aria-label="Сон">${['плохо','урывками','средне','хорошо','отлично'].map((l,i)=>`<button data-sleep="${i+1}" aria-pressed="${di.sleep===i+1}">${moonSVG(i/4)}<span>${l}</span></button>`).join('')}</div>
<span class="small muted it" style="display:block;margin-top:14px">Настроение дня</span>
<div class="moons" role="group" aria-label="Настроение">${['тяжело','так себе','ровно','хорошо','светло'].map((l,i)=>`<button data-mood="${i+1}" aria-pressed="${di.mood===i+1}">${moonSVG(i/4)}<span>${l}</span></button>`).join('')}</div>
<span class="small muted it" style="display:block;margin-top:14px">Энергия</span>
<div class="moons" role="group" aria-label="Энергия">${['на нуле','мало','средне','бодро','полно'].map((l,i)=>`<button data-energy="${i+1}" aria-pressed="${di.energy===i+1}">${moonSVG(i/4)}<span>${l}</span></button>`).join('')}</div>
<div class="toggle"><span>Перегруз, перенапряжение</span><button class="sw" data-over aria-pressed="${!!di.over}" aria-label="Перегруз"></button></div>
${di.over?`<span class="lbl">Откуда перегруз</span>${chipset('over',S.over,di.overWhat?[di.overWhat]:[])}<p class="hint">Завтра можно сразу выбрать бережный режим. <button class="link" data-art="a7">Почему это не слабость</button></p>`:''}
<div class="band">${(()=>{const TA={a1:50,a2:29,a3:44,a4:42,a5:57,a6:26,a7:3,a8:39,a9:13,a10:2,a11:23,a12:32,a13:35};const a=ARTDEF[TA[th[2]]??30];return `<div class="bandart">${kimg(ASSETS.wide,'dark','widearch')}<button class="archbtn" data-art="${th[2]}" aria-label="Открыть статью">${FR.archF(156,210,a.src,a.pos,"band")}</button></div>`})()}<p class="eyebrow">Мысль дня</p><p class="thesis">${th[0]}</p><p class="src">${th[1]}</p><button class="link" style="margin-top:8px" data-art="${th[2]}">Читать подробнее</button></div>`}

function row(h,l,mode){const target=mode==='min'?h.min:mode==='soft'?h.full+' или '+h.min:h.full;
const isOpen=OPEN===h.id;const st=l?l.s:'';
const icon=st==='skip'?STARX:STAR(st==='done'||st==='part');
const wk=h.freq.type==='weekly'?` · ${weekCount(h,T)} из ${h.freq.n} за неделю`:'';
const note=l?(l.s==='skip'?'пропуск: '+esc(l.reason):(l.s==='part'?'частично':'сделала')+(l.time?' в '+l.time:'')):'';
return `<div class="rt" style="--hc:var(--c-${h.color})"><div class="rt-h"><span class="rtp">${kimg(ASSETS.icons[iconOf(h,S.habits.indexOf(h))],'light')}</span><button class="rt-name" data-open="${h.id}" aria-expanded="${isOpen}"><span class="w">${esc(h.name)}${stars(h.stars)}</span><span class="s">после того как ${esc(h.anchor)} — ${esc(target)}${wk}</span>${note?`<span class="n">${note}</span>`:''}</button>
<button class="starbtn ${st} ${isOpen?'open':''}" data-open="${h.id}" aria-label="Отметить: ${esc(h.name)}">${icon}</button></div>
${isOpen&&L&&L.type==='mark'?`<div class="pcard">${markBody()}</div>`:''}</div>`}

function chipset(key,arr,sel,manage){const all=recent(arr),open=EXP.has(key)||manage;
const top=all.slice(0,3),rest=all.slice(3);
const c=(x,rec)=>manage?`<span class="chip rec">${esc(x[0])}<button class="x" data-del="${key}" data-v="${esc(x[0])}" aria-label="Удалить ${esc(x[0])}">×</button></span>`
:`<button class="chip ${rec?'rec':''}" data-pick="${key}" data-v="${esc(x[0])}" aria-pressed="${sel.includes(x[0])}">${esc(x[0])}</button>`;
return `<div class="chips">${(manage?all:top).map(x=>c(x,1)).join('')}
${!manage?(open?rest.map(x=>c(x,0)).join(''):'')+`<button class="more" data-exp="${key}">${STAR(1)}${open?'свернуть':rest.length?'ещё '+rest.length:'своё'}</button>`:''}</div>
${open?`<div class="addrow"><input data-newv="${key}" placeholder="вписать своё" aria-label="Новый вариант"><button data-addk="${key}" aria-label="Добавить">${STAR(1)}</button></div>`:''}`}

let L=null,EXP=new Set();
function markBody(){const h=L.h,mode=dayInfo(L.dk).mode,isT=L.dk===TODAY;
return `<div class="ct"><span class="script" style="font-size:19px">${isT?'сегодня':D(L.dk).toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}</span><h2 style="margin-top:4px">${esc(h.name)}</h2>
<p class="small muted" style="margin-top:4px">${mode==='min'?'Минимум: '+esc(h.min):'Полностью: '+esc(h.full)+'. Минимум: '+esc(h.min)}</p></div>
<div class="choice">${[['done','Сделала'],['part','Частично'],['skip','Пропуск']].map(([v,t])=>`<button data-s="${v}" aria-pressed="${L.s===v}">${t}</button>`).join('')}</div>
${L.s!=='skip'?`<span class="lbl">Во сколько</span><div class="timerow"><input type="time" data-time value="${esc(L.time)}" aria-label="Время выполнения"><button data-now>сейчас</button></div>
<span class="lbl">Как было</span><div class="chips">${[['easy','легко и приятно'],['ok','нормально'],['hard','через силу']].map(([v,t])=>`<button class="chip" data-how="${v}" aria-pressed="${L.how===v}">${t}</button>`).join('')}</div>
<div class="toggle"><span>Настроение до и после</span><button class="sw" data-mm aria-pressed="${!!L.mm}" aria-label="Отмечать настроение до и после"></button></div>
${L.mm?`<span class="lbl">До</span>${moonRow('mb',L.mb)}<span class="lbl">После</span>${moonRow('ma',L.ma)}`:''}
<span class="lbl">Вместо чего</span>${chipset('instead',h.insteads,[L.instead])}`
:`<span class="lbl">Что помешало</span>${chipset('reason',h.reasons,[L.reason])}`}
<div id="err"></div>
<button class="btn main" style="margin-top:24px" data-savemark>Отметить</button>
${dayLog(L.dk)[h.id]?'<button class="btn ghost" style="margin-top:10px" data-unmark>Снять отметку</button>':''}
<p class="center" style="margin-top:14px"><button class="link" data-edit="${h.id}">Настроить рутину</button></p>`}
function startMark(id,dk){const h=S.habits.find(x=>x.id===id),l=dayLog(dk)[id]||{};EXP=new Set();
L={type:'mark',h,dk,s:l.s||'done',how:l.how||'',reason:l.reason||'',instead:l.instead||'',time:l.time||(dk===TODAY?nowHM():''),inline:dk===TODAY,mm:!!(l.mb||l.ma||h.mmOn),mb:l.mb||0,ma:l.ma||0}}
const MOODL=['тяжело','так себе','ровно','хорошо','светло'];
function moonRow(key,val){return `<div class="moons">${MOODL.map((l,i)=>`<button data-mrow="${key}" data-v="${i+1}" aria-pressed="${val===i+1}">${moonSVG(i/4)}<span>${l}</span></button>`).join('')}</div>`}
function openInline(id){if(OPEN===id){OPEN=null;L=null;render();return}startMark(id,TODAY);L.draw=render;OPEN=id;render()}
function openMarkSheet(id,dk){startMark(id,dk);L.draw=()=>sheet(markBody());L.draw()}

function freqText(f){return f.type==='daily'?'каждый день':f.type==='days'?f.days.slice().sort((a,b)=>((a+6)%7)-((b+6)%7)).map(d=>WD[d]).join(', '):f.n+' '+plural(f.n,'раз','раза','раз')+' в неделю'}
function nums(h){let plan=0,ok=0,hard=0,how=0;const rs={},wo=[0,0,0,0,0,0,0],wp=[0,0,0,0,0,0,0],tms=[];
for(let i=27;i>=0;i--){const d=addD(T,-i),dk=k(d),l=(S.logs[dk]||{})[h.id];
if(sched(h,d)&&h.freq.type!=='weekly'&&(dk<TODAY||l)){plan++;wp[d.getDay()]++;if(l&&l.s!=='skip'){ok++;wo[d.getDay()]++}}
if(l&&l.time){const[a,b]=l.time.split(':');tms.push(+a*60+ +b)}
if(l&&l.s==='skip')rs[l.reason]=(rs[l.reason]||0)+1;if(l&&l.how){how++;if(l.how==='hard')hard++}}
tms.sort((a,b)=>a-b);const med=tms.length?tms[Math.floor(tms.length/2)]:null;
const wk=h.freq.type==='weekly',wc=weekCount(h,T);
return{pct:wk?Math.min(1,wc/h.freq.n):plan?ok/plan:0,label:wk?wc+'/'+h.freq.n:(plan?Math.round(ok/plan*100):0)+'%',

function close(){document.getElementById('layer').innerHTML='';L=null;OPEN=null;EXP=new Set();render()}
function redraw(){const sc=document.querySelector('.sheet');const top=sc?sc.scrollTop:0;if(L&&L.draw){L.draw();const s2=document.querySelector('.sheet');if(s2)s2.scrollTop=top}else render()}

function openDay(dk){const dt=D(dk),lg=S.logs[dk]||{},di=S.days[dk];L={type:'day',dk,draw:()=>openDay(dk)};
const hs=S.habits.filter(h=>lg[h.id]||(dk>=h.start&&(h.freq.type!=='days'||h.freq.days.includes(dt.getDay())))).sort(byStars);
const mood=['','тяжело','так себе','ровно','хорошо','светло'],en=['','на нуле','мало','средне','бодро','полно'];
sheet(`<div class="center"><span class="script" style="font-size:19px">${WD[dt.getDay()]}</span><h2 style="margin-top:4px">${dt.toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}</h2></div>
${di&&(di.mood||di.energy)?`<p class="small muted it center" style="margin-top:6px">Настроение: ${mood[di.mood]||'—'}. Энергия: ${en[di.energy]||'—'}${di.over?'. Перегруз'+(di.overWhat?': '+esc(di.overWhat):''):''}</p>`:''}
<div style="margin-top:14px">${hs.map(h=>{const l=lg[h.id];return `<button class="row" data-markday="${h.id}" style="--hc:var(--c-${h.color})"><span style="display:flex;gap:10px;align-items:center"><span class="mk ${l?l.s:''}">${l?(l.s==='skip'?CROSS:l.s==='done'?CHECK:''):''}</span><span>${esc(h.name)}</span></span><span class="small muted it">${l?(l.s==='done'?'сделала':l.s==='part'?'частично':'пропуск')+(l.time?' · '+l.time:''):'не отмечено'}</span></button>`}).join('')||'<p class="muted center">В этот день ничего не было запланировано.</p>'}</div>`)}

function openGallery(){L={type:'gal',draw:openGallery};
sheet(`<div class="center"><span class="script" style="font-size:19px">галерея</span><h2 style="margin-top:4px">Картины в арке</h2>
<p class="small muted" style="margin-top:8px">Нажми на картину — она встанет в главную арку. Или пусть картина меняется сама каждый день.</p><button class="tg2" data-artauto><span><b>Менять картину каждый день</b><small>${S.heroArt==null?'Включено: картина в арке меняется сама':'Выключено: в арке выбранная тобой картина'}</small></span><span class="sw" aria-pressed="${S.heroArt==null}"></span></button></div>
<div class="gal">${ARTDEF.map((a,i)=>`<button class="g gpick" data-pickart="${i}" aria-pressed="${S.heroArt===i}"><div class="archframe"><div class="arch"><img src="${a.src}" alt="Картина ${i+1}" loading="lazy" style="object-position:${a.pos}"></div></div></button>`).join('')}${S.gallery.map((src,i)=>`<div class="g"><button class="gpick" data-pickart="${ARTDEF.length+i}" aria-pressed="${S.heroArt===ARTDEF.length+i}"><div class="archframe"><div class="arch"><img src="${src}" alt="Своя картина ${i+1}"></div></div></button><button class="del" data-delimg="${i}" aria-label="Удалить картину">×</button></div>`).join('')}</div>
<label class="upl btn main">Добавить картину<input type="file" accept="image/*" data-upload multiple></label>
<div id="err"></div>
<p class="hint">Где взять: Wikimedia Commons, поиск по имени художника. Например, Уотерхаус «Леди из Шалот», «Волшебный круг», Россетти «Прозерпина», Милле «Офелия», Бёрн-Джонс «Шиповник».</p>`)}
function addImage(file){return new Promise(res=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,900/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.gallery.push(c.toDataURL('image/jpeg',.8));if(!save()){S.gallery.pop();res(false)}else res(true)};im.onerror=()=>res(false);im.src=fr.result};fr.readAsDataURL(file)})}

function openArt(id){const a=ARTS.find(x=>x.id===id);L={type:'art'};
sheet(`<div class="reader"><div class="rhead"><div class="rframe">${FR.archF(190,254,'','','rd')}${plantImg(a.id,'light','rplant2')}</div><span class="rmoon">${STMOON[a.st]<0?STAR(1):moonSVG(STMOON[a.st])}</span></div><div class="center"><span class="script" style="font-size:19px">${STAGES[a.st].toLowerCase()}</span></div><h2 style="margin-top:6px;font-size:32px">${a.t}</h2><div class="fx-rate big" aria-label="Оценка статьи">${[1,2,3].map(v=>`<button data-arate="${a.id}:${v}" aria-label="${v} из 3">${STAR(v<=(S.rates[a.id]||0))}</button>`).join('')}</div><p class="small muted center">понравилась? отметь звёздами — подруги увидят</p><p class="intro dropcap">${a.i}</p>
${a.p.map(x=>`<p class="pt">${SPRIG}${x}</p>`).join('')}<div class="todo">${plantImg(a.id,'light','tcorner')}<b>Что с этим делать</b>${a.d}</div>
<div style="margin-top:20px">${a.s.map(x=>`<p class="src" style="margin-top:4px">${x}</p>`).join('')}</div></div>`)}

const AUTO=['Я делаю это автоматически','Делаю, не напоминая себе специально','Делаю, не задумываясь','Начинаю раньше, чем осознаю, что начала'];
function openAuto(id){const h=S.habits.find(x=>x.id===id);L={type:'auto',h,v:[3,3,3,3]};
sheet(`<h2>Автоматизм</h2><p class="small muted" style="margin-top:6px">${esc(h.name)}. Четыре утверждения из короткой шкалы SRBAI (Гарднер и коллеги, 2012). 1 — совсем не про меня, 5 — точно про меня. Раз в две недели достаточно.</p>
${AUTO.map((q,i)=>`<div class="q"><div style="display:flex;justify-content:space-between;gap:8px"><span>${q}</span><span id="av${i}">3</span></div><input type="range" min="1" max="5" step="1" value="3" data-av="${i}" aria-label="${q}"></div>`).join('')}
<button class="btn main" style="margin-top:24px" data-saveauto>Сохранить</button>`)}

function openEdit(id){EXP=new Set();const src=id?S.habits.find(x=>x.id===id):null;
const h=src?JSON.parse(JSON.stringify(src)):{id:'h'+Date.now(),name:'',anchor:'',full:'',min:'',freq:{type:'daily'},start:TODAY,color:COLORS[S.habits.length%COLORS.length],stars:3,motives:[],reasons:recent(S.habits[0]?S.habits[0].reasons:[]).slice(0,0).concat([['устала',Date.now()-2],['забыла',Date.now()-1],['нет времени',Date.now()-3]]),insteads:[],paused:false,auto:[]};
L={type:'edit',h,isNew:!src,draw:drawEdit};drawEdit()}
function drawEdit(){const h=L.h,f=h.freq;
sheet(`<span class="script" style="font-size:19px">${L.isNew?'новая рутина':'рутина'}</span>
<label class="lbl" for="e-name">Что хочу делать</label><input id="e-name" data-f="name" value="${esc(h.name)}" placeholder="растяжка">
<label class="lbl" for="e-anchor">После того как…</label><input id="e-anchor" data-f="anchor" value="${esc(h.anchor)}" placeholder="выпью утренний кофе">
<label class="lbl" for="e-full">Полная версия</label><input id="e-full" data-f="full" value="${esc(h.full)}" placeholder="10 минут">
<label class="lbl" for="e-min">Минимум на тяжёлый день</label><input id="e-min" data-f="min" value="${esc(h.min)}" placeholder="одно движение">
<span class="lbl">Важность</span><div class="rate" role="group" aria-label="Важность">${[1,2,3,4,5].map(i=>`<button data-star="${i}" aria-label="${i} из 5">${STAR(i<=h.stars)}</button>`).join('')}</div>
<span class="lbl">Иконка</span><div class="icpick">${ASSETS.icons.map((u,i)=>`<button data-icon="${i}" aria-pressed="${iconOf(h,S.habits.indexOf(h))===i}" aria-label="Иконка ${i+1}">${kimg(u,'light')}</button>`).join('')}</div>
<span class="lbl">Растение в «Саду привычек»</span><div class="plpick">${PLANT_IDS.map(id=>`<button data-plant="${id}" aria-pressed="${plantOf(h,S.habits.indexOf(h))===id}" aria-label="Растение">${plantImg(id,'light')}</button>`).join('')}</div>
<span class="lbl">Цвет в календаре</span><div class="cols">${COLORS.map(c=>`<button data-col="${c}" style="--hc:var(--c-${c})" aria-pressed="${h.color===c}" aria-label="${c}"></button>`).join('')}</div>
<span class="lbl">Как часто</span><div class="choice" style="margin-top:8px">${[['daily','Каждый день'],['days','По дням'],['weekly','N в неделю']].map(([t,l])=>`<button data-ft="${t}" aria-pressed="${f.type===t}">${l}</button>`).join('')}</div>
${f.type==='days'?`<div class="days">${[1,2,3,4,5,6,0].map(d=>`<button data-d="${d}" aria-pressed="${f.days.includes(d)}">${WD[d]}</button>`).join('')}</div>`:''}
${f.type==='weekly'?`<div class="days">${[1,2,3,4,5,6].map(n=>`<button data-n="${n}" aria-pressed="${f.n===n}">${n}</button>`).join('')}</div>`:''}
<span class="lbl">Зачем мне это</span>${chipset('motive',h.motives,[],true)}
<span class="lbl">Что может помешать</span>${chipset('reason',h.reasons,[],true)}
<span class="lbl">Вместо чего это время</span>${chipset('instead',h.insteads,[],true)}
<p class="hint">Хороший якорь — то, что уже случается каждый день. Минимум — настолько малый, чтобы получился даже в плохой день.</p>
${!L.isNew?`<div class="toggle"><span>Активна</span><button class="sw" data-pause aria-pressed="${!h.paused}" aria-label="Активна"></button></div><p class="small muted" style="margin-top:4px">На паузе привычка не считается пропущенной.</p>`:''}
<div id="err"></div><button class="btn main" style="margin-top:22px" data-saveedit>${L.isNew?'Добавить рутину':'Сохранить'}</button>
${!L.isNew?'<button class="btn ghost" style="margin-top:10px" data-delhabit>Удалить рутину</button>':''}`)}


document.addEventListener('click',e=>{const sc=e.target.closest('[data-scrim]');if(sc&&e.target===sc){close();return}
if(FR.click(e,(e.target.closest('button')||{dataset:{}}).dataset))return;
const t=e.target.closest('button');if(!t)return;const d=t.dataset;
if(d.close!==undefined){close();return}
if(d.tab){FR.guest=null;S.tab=d.tab;OPEN=null;L=null;render();scrollTo(0,0);return}
if(d.dologin!==undefined){doLogin();return}
if(d.doreg!==undefined){doRegister();return}
if(d.auth){AUTH=d.auth;LOGIN_ERR='';render();return}
if(d.consent!==undefined){const v=keepVals();CONSENT=!CONSENT;render();putVals(v);return}
if(d.delme!==undefined){deleteMe();return}
if(d.pweye!==undefined){const v=keepVals();SHOW_PW=!SHOW_PW;render();putVals(v);return}
if(d.forgot!==undefined){const v=keepVals();FORGOT=!FORGOT;render();putVals(v);return}
if(d.logout!==undefined){save();try{api('logout')}catch(e){}SESSION=null;TOKEN=null;try{localStorage.removeItem('tropinka-token')}catch(e){}AUTH='in';try{localStorage.removeItem('tropinka-session')}catch(e){}close();return}
if(d.gallery!==undefined){openGallery();return}
if(d.help!==undefined){openHelp();return}
if(d.sync!==undefined){openSync();return}
if(d.syncnow!==undefined){flush();pullNow();openSync();return}
if(d.syncoff!==undefined){S.sync.off=!S.sync.off;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}updSync();openSync();if(!S.sync.off)flush();return}
if(d.artauto!==undefined){if(S.heroArt==null){const g=allArt();S.heroArt=((Math.floor(T/DAY)%g.length)+g.length)%g.length}else S.heroArt=null;save();openGallery();render();return}
if(d.pickart){S.heroArt=d.pickart==='auto'?null:+d.pickart;save();close();scrollTo({top:0,behavior:'smooth'});return}
if(d.moon!==undefined){openMoon();return}
if(d.astro!==undefined){openAstro();return}
if(d.fonts!==undefined){openFonts();return}
if(d.font){S.font=d.font;applyFont();save();openFonts();return}
if(d.scheme){S.scheme=d.scheme;save();render();openFonts();return}
if(d.arate){const [id,v]=d.arate.split(':');S.rates[id]=S.rates[id]==+v?0:+v;save();openArt(id);return}
if(d.delimg){S.gallery.splice(+d.delimg,1);save();openGallery();return}
if(d.calopen!==undefined){S.calOpen=!S.calOpen;S.cal={y:T.getFullYear(),m:T.getMonth()};render();return}
if(d.calm){let {y,m}=S.cal;m+=+d.calm;if(m<0){m=11;y--}if(m>11){m=0;y++}S.cal={y,m};render();return}
if(d.day){if(!S.calOpen){S.calOpen=true;render();return}openDay(d.day);return}
if(d.mode){dayInfo(TODAY).mode=d.mode;render();return}
if(d.mood){dayInfo(TODAY).mood=+d.mood;render();return}
if(d.energy){dayInfo(TODAY).energy=+d.energy;render();return}
if(d.sleep){dayInfo(TODAY).sleep=+d.sleep;render();return}
if(d.over!==undefined&&!(L&&L.type==='edit')){const di=dayInfo(TODAY);di.over=!di.over;render();return}
if(d.open){openInline(d.open);return}
if(d.markday){openMarkSheet(d.markday,L.dk);return}
if(d.art){openArt(d.art);return}
if(d.auto){openAuto(d.auto);return}
if(d.hstat){openHabitStats(d.hstat);return}
if(d.edit){OPEN=null;openEdit(d.edit);return}
if(d.newhabit!==undefined){OPEN=null;openEdit(null);return}
if(d.exp){EXP.has(d.exp)?EXP.delete(d.exp):EXP.add(d.exp);redraw();return}
if(d.pick){const v=d.v;if(d.pick==='over'){const di=dayInfo(TODAY);di.overWhat=di.overWhat===v?'':v;if(di.overWhat)touch(S.over,v);render();return}
if(L&&L.type==='mark'){L[d.pick]=L[d.pick]===v?'':v;redraw()}return}
if(d.del){const arr=listFor(d.del,L.h);const i=arr.findIndex(x=>x[0]===d.v);if(i>-1)arr.splice(i,1);redraw();return}
if(d.addk){const inp=t.parentNode.querySelector('input'),v=inp.value.trim();if(!v)return;
if(d.addk==='over'){touch(S.over,v);dayInfo(TODAY).overWhat=v;render();return}
touch(listFor(d.addk,L.h),v);if(L.type==='mark')L[d.addk]=v;redraw();return}
if(!L)return;
if(L.type==='mark'){if(d.s){L.s=d.s;redraw();return}
if(d.mrow){L[d.mrow]=+d.v;redraw();return}
if(d.mm!==undefined){L.mm=!L.mm;redraw();return}if(d.how){L.how=L.how===d.how?'':d.how;redraw();return}
if(d.now!==undefined){L.time=nowHM();redraw();return}
if(d.savemark!==undefined){if(L.s==='skip'&&!L.reason){document.getElementById('err').innerHTML='<p class="err">Выбери или впиши причину — так потом видны закономерности.</p>';return}
const rec={s:L.s};if(L.s==='skip'){rec.reason=L.reason;touch(L.h.reasons,L.reason)}else{if(L.time)rec.time=L.time;L.h.mmOn=L.mm;if(L.mm&&(L.mb||L.ma)){if(L.mb)rec.mb=L.mb;if(L.ma)rec.ma=L.ma}if(L.how)rec.how=L.how;if(L.instead){rec.instead=L.instead;touch(L.h.insteads,L.instead)}}
dayLog(L.dk)[L.h.id]=rec;const back=L.inline?null:L.dk;close();if(back)openDay(back);return}
if(d.unmark!==undefined){delete dayLog(L.dk)[L.h.id];const back=L.inline?null:L.dk;close();if(back)openDay(back);return}}
if(L.type==='auto'&&d.saveauto!==undefined){L.h.auto.push({date:TODAY,score:L.v.reduce((a,b)=>a+b,0)/4});close();return}
if(L.type==='edit'){const h=L.h;
if(d.star){h.stars=+d.star;redraw();return}
if(d.col){h.color=d.col;redraw();return}
if(d.plant){h.plant=d.plant;redraw();return}
if(d.icon!==undefined){h.icon=+d.icon;redraw();return}
if(d.ft){h.freq=d.ft==='daily'?{type:'daily'}:d.ft==='days'?{type:'days',days:h.freq.days||[1,2,3,4,5]}:{type:'weekly',n:h.freq.n||3};redraw();return}
if(d.d){const n=+d.d,ds=h.freq.days;h.freq.days=ds.includes(n)?ds.filter(x=>x!==n):[...ds,n];redraw();return}
if(d.n){h.freq.n=+d.n;redraw();return}
if(d.pause!==undefined){h.paused=!h.paused;redraw();return}
if(d.saveedit!==undefined){const er=document.getElementById('err');
if(!h.name.trim()||!h.anchor.trim()||!h.min.trim()){er.innerHTML='<p class="err">Нужны название, якорь и минимальная версия.</p>';return}
if(h.freq.type==='days'&&!h.freq.days.length){er.innerHTML='<p class="err">Выбери хотя бы один день.</p>';return}
if(!h.full.trim())h.full=h.min;
const i=S.habits.findIndex(x=>x.id===h.id);if(i>-1)S.habits[i]=h;else S.habits.push(h);close();return}
if(d.delhabit!==undefined){if(confirm('Удалить рутину «'+h.name+'»? Отметки по ней тоже пропадут.')){S.habits=S.habits.filter(x=>x.id!==h.id);close()}return}}});
document.addEventListener('input',e=>{const t=e.target;
if(t.dataset.f&&L&&L.type==='edit'){L.h[t.dataset.f]=t.value;return}
if(t.dataset.time!==undefined&&L&&L.type==='mark'){L.time=t.value;return}
if(t.dataset.av!==undefined&&L){L.v[+t.dataset.av]=+t.value;document.getElementById('av'+t.dataset.av).textContent=t.value}});
document.addEventListener('change',async e=>{const t=e.target;if(t.dataset.upload===undefined)return;let fail=0;for(const f of t.files){if(!(await addImage(f)))fail++}
openGallery();if(fail)document.getElementById('err').innerHTML='<p class="err">Не все картины поместились — в памяти телефона для приложения мало места. Удали одну и попробуй снова.</p>';render()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.closest&&e.target.closest('.loginbox')){e.preventDefault();AUTH==='up'?doRegister():doLogin();return}if(e.key==='Escape'&&L&&!L.inline)close();if(e.key==='Enter'&&e.target.dataset.newv){e.preventDefault();e.target.nextElementSibling.click()}});
if(SESSION&&!TOKEN)SESSION=null;if(SESSION)loadSynced(false);
applyFont();render();if(SESSION)setTimeout(pullNow,300);
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
<script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js" onload="astroReady()" async></script>
